services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: bds_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bds-be:
    build:
      context: .
      dockerfile: Dockerfile
    image: bds-be-v1
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - /opt/global:/opt/global/
    mem_limit: 1G
    restart: always
volumes:
  mysql_data:
  redis_data: